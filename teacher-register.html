<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration - SVLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md my-10">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-green-600">Teacher Portal</h2>
            <p class="text-gray-500">Create your educator account</p>
        </div>

        <form id="teacherForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Full Name</label>
                <input type="text" id="teacherName" required class="w-full p-3 border rounded-lg mt-1 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="teacherEmail" required class="w-full p-3 border rounded-lg mt-1 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="teacherPassword" required class="w-full p-3 border rounded-lg mt-1 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            
            <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                Register as Teacher
            </button>
        </form>

        <div id="message" class="mt-6 text-sm text-center font-medium"></div>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm text-gray-600 hover:underline">Already have an account? Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E",
  authDomain: "cmcsvls.firebaseapp.com",
  projectId: "cmcsvls",
  storageBucket: "cmcsvls.firebasestorage.app",
  messagingSenderId: "973791112453",
  appId: "1:973791112453:web:728b9ac51c0f3f89955b6c",
  measurementId: "G-7KEY33ZZHE"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('teacherForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.className = "mt-6 text-blue-600";
            messageDiv.innerText = "Creating account...";

            const name = document.getElementById('teacherName').value;
            const email = document.getElementById('teacherEmail').value;
            const password = document.getElementById('teacherPassword').value;

            try {
                // 1. Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Create User Role Record
                await setDoc(doc(db, "users", user.uid), {
                    email: email,
                    role: "teacher",
                    active: true // Teachers are active by default for this MVP flow
                });

                // 3. Create Teacher Profile Record
                await setDoc(doc(db, "teachers", user.uid), {
                    uid: user.uid,
                    name: name,
                    assignedClasses: [], // Initially empty
                    createdAt: new Date().toISOString()
                });

                messageDiv.className = "mt-6 text-green-600";
                messageDiv.innerText = "Teacher account created! Redirecting to login...";
                
                await signOut(auth); // Sign out so they can log in properly

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2000);

            } catch (error) {
                messageDiv.className = "mt-6 text-red-600";
                messageDiv.innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
