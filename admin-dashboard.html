<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVLS | Admin Command Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar-link.active { background: #1e40af; border-right: 4px solid #fbbf24; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .scroll-custom::-webkit-scrollbar { width: 5px; }
        .scroll-custom::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex font-sans text-slate-900">

    <aside class="w-72 bg-blue-950 text-slate-300 flex-shrink-0 flex flex-col sticky top-0 h-screen shadow-2xl z-50">
        <div class="p-8 border-b border-blue-900">
            <h1 class="text-2xl font-black tracking-tighter text-white italic">SVLS <span class="text-blue-400">PRO</span></h1>
            <p id="adminEmail" class="text-[10px] font-bold uppercase tracking-widest text-blue-500 mt-2 truncate">Admin Control</p>
        </div>
        <nav class="flex-1 mt-6 overflow-y-auto scroll-custom">
            <button onclick="showTab('academic')" class="sidebar-link active w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-university"></i> <span class="text-xs font-black uppercase">Academic Setup</span>
            </button>
            <button onclick="showTab('assignments')" class="sidebar-link w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-link"></i> <span class="text-xs font-black uppercase">Enrollments & Linking</span>
            </button>
            <button onclick="showTab('records')" class="sidebar-link w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-database"></i> <span class="text-xs font-black uppercase">Master Records</span>
            </button>
        </nav>
        <div class="p-6 border-t border-blue-900">
            <button onclick="auth.signOut()" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl font-black text-[10px] uppercase transition-all">Logout</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white/80 backdrop-blur-md border-b p-6 flex justify-between items-center sticky top-0 z-40">
            <h2 id="tabTitle" class="text-sm font-black text-slate-400 uppercase tracking-widest">Academic Setup</h2>
        </header>

        <div class="p-8 max-w-7xl mx-auto space-y-12">
            
            <section id="academic" class="tab-content active space-y-10">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-3xl border shadow-sm">
                        <h3 class="font-black text-blue-900 mb-6 uppercase text-xs tracking-widest border-b pb-2">Course Definition</h3>
                        <form id="courseForm" class="space-y-4">
                            <input type="text" id="courseName" placeholder="Course Name (e.g., BS Information Technology)" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-blue-600" required>
                            <input type="number" id="courseDuration" placeholder="Duration (Total Years)" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-blue-600" required>
                            <button class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">Save Course</button>
                        </form>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border shadow-sm">
                        <h3 class="font-black text-blue-900 mb-6 uppercase text-xs tracking-widest border-b pb-2">Subject Detail</h3>
                        <form id="subjectForm" class="space-y-4">
                            <input type="text" id="subjName" placeholder="Subject Name" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-blue-600" required>
                            <select id="subjCourse" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-none outline-blue-600" required></select>
                            <div class="grid grid-cols-2 gap-4">
                                <select id="subjSem" class="p-4 bg-slate-50 rounded-2xl font-bold border-none outline-blue-600">
                                    <option value="1">1st Semester</option><option value="2">2nd Semester</option>
                                </select>
                                <select id="subjTeacher" class="p-4 bg-slate-50 rounded-2xl font-bold border-none outline-blue-600" required></select>
                            </div>
                            <button class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg">Register Subject</button>
                        </form>
                    </div>
                </div>
            </section>

            <section id="assignments" class="tab-content space-y-10">
                <div class="bg-white p-8 rounded-3xl border shadow-sm">
                    <h3 class="font-black text-emerald-700 mb-6 uppercase text-xs tracking-widest">Enroll Student to Course & Subject</h3>
                    <form id="enrollForm" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <select id="enrollStudent" class="p-4 bg-slate-50 rounded-2xl font-bold border-none outline-emerald-600" required></select>
                        <select id="enrollCourse" class="p-4 bg-slate-50 rounded-2xl font-bold border-none outline-emerald-600" required></select>
                        <select id="enrollSubject" class="p-4 bg-slate-50 rounded-2xl font-bold border-none outline-emerald-600" required></select>
                        <button class="md:col-span-3 bg-emerald-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-xl hover:bg-emerald-700">Finalize Enrollment</button>
                    </form>
                </div>
            </section>

            <section id="records" class="tab-content space-y-10">
                <div class="space-y-6">
                    <h4 class="font-black text-xs uppercase text-slate-400 tracking-widest">Courses Management</h4>
                    <div class="bg-white rounded-3xl border overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400 border-b">
                                <tr><th class="p-4">Course</th><th class="p-4">Duration</th><th class="p-4 text-right">Actions</th></tr>
                            </thead>
                            <tbody id="courseMaster" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>

                <div class="space-y-6">
                    <h4 class="font-black text-xs uppercase text-slate-400 tracking-widest">Subjects & Faculty Assignment</h4>
                    <div class="bg-white rounded-3xl border overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400 border-b">
                                <tr><th class="p-4">Subject</th><th class="p-4">Teacher</th><th class="p-4">Semester</th><th class="p-4 text-right">Actions</th></tr>
                            </thead>
                            <tbody id="subjectMaster" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc, addDoc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E", 
            authDomain: "cmcsvls.firebaseapp.com", 
            projectId: "cmcsvls", 
            storageBucket: "cmcsvls.firebasestorage.app", 
            messagingSenderId: "973791112453", 
            appId: "1:973791112453:web:728b9ac51c0f3f89955b6c" 
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Handlers
        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('tabTitle').innerText = tab.replace(/^\w/, c => c.toUpperCase());
            refreshAll();
        };

        // Core Functions
        async function refreshAll() {
            loadDropdowns();
            loadMasterData();
        }

        async function loadDropdowns() {
            const courses = await getDocs(collection(db, "courses"));
            const teachers = await getDocs(collection(db, "teachers"));
            const students = await getDocs(collection(db, "users")); // Filtered student role in UI
            const subjects = await getDocs(collection(db, "subjects"));

            const fill = (id, snap, type) => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="">Select Option</option>';
                snap.forEach(d => {
                    const data = d.data();
                    if(type === 'student' && data.role !== 'student') return;
                    el.innerHTML += `<option value="${d.id}">${data.name || data.email}</option>`;
                });
            };

            fill('subjCourse', courses);
            fill('subjTeacher', teachers);
            fill('enrollCourse', courses);
            fill('enrollStudent', students, 'student');
            fill('enrollSubject', subjects);
        }

        // --- ADD/UPDATE DATA ---
        document.getElementById('courseForm').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('courseName').value;
            const years = document.getElementById('courseDuration').value;
            await addDoc(collection(db, "courses"), { name, duration: years });
            e.target.reset(); refreshAll();
        };

        document.getElementById('subjectForm').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "subjects"), {
                name: document.getElementById('subjName').value,
                courseId: document.getElementById('subjCourse').value,
                semester: document.getElementById('subjSem').value,
                teacherId: document.getElementById('subjTeacher').value
            });
            e.target.reset(); refreshAll();
        };

        document.getElementById('enrollForm').onsubmit = async (e) => {
            e.preventDefault();
            const sid = document.getElementById('enrollStudent').value;
            const cid = document.getElementById('enrollCourse').value;
            const subid = document.getElementById('enrollSubject').value;
            
            // Link student to their academic profile
            await setDoc(doc(db, "enrollments", `${sid}_${subid}`), {
                studentId: sid, courseId: cid, subjectId: subid, date: new Date()
            });
            alert("Enrollment Successful");
        };

        // --- MASTER RECORD LOADING & UPDATE ---
        async function loadMasterData() {
            const courseList = document.getElementById('courseMaster');
            const subjectList = document.getElementById('subjectMaster');
            courseList.innerHTML = ""; subjectList.innerHTML = "";

            const courses = await getDocs(collection(db, "courses"));
            courses.forEach(d => {
                courseList.innerHTML += `<tr>
                    <td class="p-4 font-bold">${d.data().name}</td>
                    <td class="p-4 text-xs font-black text-blue-600">${d.data().duration} Years</td>
                    <td class="p-4 text-right">
                        <button onclick="updateData('courses', '${d.id}', 'name')" class="text-blue-500 mr-4 text-xs font-bold">Edit</button>
                        <button onclick="deleteData('courses', '${d.id}')" class="text-rose-500 text-xs font-bold">Delete</button>
                    </td>
                </tr>`;
            });

            const subjects = await getDocs(collection(db, "subjects"));
            for (const d of subjects.docs) {
                const tea = await getDoc(doc(db, "teachers", d.data().teacherId));
                subjectList.innerHTML += `<tr>
                    <td class="p-4 font-bold">${d.data().name}</td>
                    <td class="p-4 text-xs font-bold text-slate-500">${tea.exists() ? tea.data().name : 'Unassigned'}</td>
                    <td class="p-4 font-black text-indigo-500 text-[10px]">Sem ${d.data().semester}</td>
                    <td class="p-4 text-right">
                        <button onclick="updateData('subjects', '${d.id}', 'name')" class="text-blue-500 mr-4 text-xs font-bold">Rename</button>
                        <button onclick="deleteData('subjects', '${d.id}')" class="text-rose-500 text-xs font-bold">Delete</button>
                    </td>
                </tr>`;
            }
        }

        window.updateData = async (col, id, field) => {
            const newVal = prompt("Enter new value:");
            if(newVal) {
                await updateDoc(doc(db, col, id), { [field]: newVal });
                refreshAll();
            }
        };

        window.deleteData = async (col, id) => {
            if(confirm("Are you sure?")) { await deleteDoc(doc(db, col, id)); refreshAll(); }
        };

        onAuthStateChanged(auth, u => { if(u) refreshAll(); else window.location.href="login.html"; });

    </script>
</body>
</html>
