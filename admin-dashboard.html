<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SVLS Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      getDocs,
      getDoc,
      setDoc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    /* ======================
       FIREBASE CONFIG
    ====================== */
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_BUCKET",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ======================
       STATE
    ====================== */
    let selectedClassId = null;

    /* ======================
       DOM
    ====================== */
    const pendingList = document.getElementById("pendingList");
    const teacherList = document.getElementById("teacherList");
    const classList = document.getElementById("classList");
    const assignedStudents = document.getElementById("assignedStudents");
    const availableStudents = document.getElementById("availableStudents");

    /* ======================
       AUTH GUARD
    ====================== */
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        alert("Not logged in");
        location.href = "login.html";
      }
    });

    /* ======================
       LOAD PENDING STUDENTS
    ====================== */
    async function loadPendingStudents() {
      pendingList.innerHTML = "";
      const snap = await getDocs(collection(db, "users"));

      snap.forEach(d => {
        const u = d.data();
        if (u.role === "student" && !u.approved) {
          const div = document.createElement("div");
          div.className = "flex justify-between items-center border p-2 rounded";
          div.innerHTML = `
            <div>
              <div class="font-semibold">${u.email}</div>
              <div class="text-xs text-gray-500">Pending approval</div>
            </div>
            <button class="bg-green-600 text-white px-3 py-1 rounded text-sm">
              Approve
            </button>
          `;
          div.querySelector("button").onclick = async () => {
            await setDoc(doc(db, "users", d.id), { approved: true }, { merge: true });
            loadPendingStudents();
            loadAvailableStudents();
          };
          pendingList.appendChild(div);
        }
      });
    }

    /* ======================
       LOAD TEACHERS + LOAD
    ====================== */
    async function loadTeachers() {
      teacherList.innerHTML = "";
      const teachersSnap = await getDocs(collection(db, "teachers"));
      const classesSnap = await getDocs(collection(db, "classes"));

      teachersSnap.forEach(t => {
        let classCount = 0;
        classesSnap.forEach(c => {
          if (c.data().teacherId === t.id) classCount++;
        });

        const div = document.createElement("div");
        div.className = "border p-3 rounded";
        div.innerHTML = `
          <div class="font-semibold">${t.data().name}</div>
          <div class="text-sm text-gray-600">
            Classes: ${classCount}
          </div>
        `;
        teacherList.appendChild(div);
      });
    }

    /* ======================
       LOAD CLASSES
    ====================== */
    async function loadClasses() {
      classList.innerHTML = "";
      const snap = await getDocs(collection(db, "classes"));

      snap.forEach(c => {
        const div = document.createElement("div");
        div.className =
          "border p-3 rounded cursor-pointer hover:bg-blue-50";
        div.innerHTML = `
          <div class="font-semibold">${c.data().subject}</div>
          <div class="text-sm text-gray-500">
            ${c.data().teacherName} · ${c.data().semester}
          </div>
        `;
        div.onclick = () => selectClass(c.id);
        classList.appendChild(div);
      });
    }

    /* ======================
       SELECT CLASS
    ====================== */
    async function selectClass(classId) {
      selectedClassId = classId;
      assignedStudents.innerHTML = "";
      availableStudents.innerHTML = "";

      const assignedSnap = await getDocs(
        collection(db, "classes", classId, "students")
      );

      const assignedIds = [];

      assignedSnap.forEach(s => {
        assignedIds.push(s.id);
        const div = document.createElement("div");
        div.className = "flex justify-between items-center border p-2 rounded";
        div.innerHTML = `
          <span>${s.id}</span>
          <button class="text-red-600 text-sm">Remove</button>
        `;
        div.querySelector("button").onclick = async () => {
          await deleteDoc(doc(db, "classes", classId, "students", s.id));
          selectClass(classId);
        };
        assignedStudents.appendChild(div);
      });

      const usersSnap = await getDocs(collection(db, "users"));
      usersSnap.forEach(u => {
        if (u.data().approved && u.data().role === "student" && !assignedIds.includes(u.id)) {
          const div = document.createElement("div");
          div.className = "flex justify-between items-center border p-2 rounded";
          div.innerHTML = `
            <span>${u.data().email}</span>
            <button class="text-green-600 text-sm">Add</button>
          `;
          div.querySelector("button").onclick = async () => {
            await setDoc(doc(db, "classes", classId, "students", u.id), {
              assignedAt: Date.now()
            });
            selectClass(classId);
          };
          availableStudents.appendChild(div);
        }
      });
    }

    /* ======================
       INIT
    ====================== */
    loadPendingStudents();
    loadTeachers();
    loadClasses();
  </script>
</head>

<body class="bg-gray-100 min-h-screen">

  <!-- HEADER -->
  <header class="bg-white border-b px-6 py-4">
    <h1 class="text-2xl font-bold">SVLS Admin Dashboard</h1>
  </header>

  <!-- CONTENT -->
  <main class="p-6 grid grid-cols-12 gap-6">

    <!-- LEFT -->
    <section class="col-span-3 space-y-6">
      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-3">Pending Students</h2>
        <div id="pendingList" class="space-y-2"></div>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-3">Teachers</h2>
        <div id="teacherList" class="space-y-2"></div>
      </div>
    </section>

    <!-- CENTER -->
    <section class="col-span-4 bg-white p-4 rounded shadow">
      <h2 class="font-semibold mb-3">Classes</h2>
      <div id="classList" class="space-y-2"></div>
    </section>

    <!-- RIGHT -->
    <section class="col-span-5 grid grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-3">Available Students</h2>
        <div id="availableStudents" class="space-y-2"></div>
      </div>

      <div class="bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-3">Assigned Students</h2>
        <div id="assignedStudents" class="space-y-2"></div>
      </div>
    </section>

  </main>

</body>
</html>
