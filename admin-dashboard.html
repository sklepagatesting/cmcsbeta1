
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVLS | Admin Command Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar-link.active { background: #1e40af; border-right: 4px solid #fbbf24; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex font-sans text-slate-900">

    <aside class="w-72 bg-blue-950 text-slate-300 flex-shrink-0 flex flex-col sticky top-0 h-screen shadow-2xl z-50">
        <div class="p-8 border-b border-blue-900">
            <h1 class="text-2xl font-black tracking-tighter text-white italic">SVLS <span class="text-blue-400">PRO</span></h1>
            <p id="adminEmail" class="text-[10px] font-bold uppercase tracking-widest text-blue-500 mt-2 truncate"></p>
        </div>

        <nav class="flex-1 mt-6">
            <button onclick="showTab('approvals')" class="sidebar-link active w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-user-shield"></i> <span class="text-xs font-black uppercase">Pending Approvals</span>
            </button>
            <button onclick="showTab('academic')" class="sidebar-link w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-university"></i> <span class="text-xs font-black uppercase">Academic Setup</span>
            </button>
            <button onclick="showTab('assignments')" class="sidebar-link w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-project-diagram"></i> <span class="text-xs font-black uppercase">Class Assignments</span>
            </button>
            <button onclick="showTab('comms')" class="sidebar-link w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white">
                <i class="fas fa-comment-dots"></i> <span class="text-xs font-black uppercase">Teacher Comms</span>
            </button>
        </nav>

        <div class="p-6 border-t border-blue-900">
            <button id="logoutBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl font-black text-[10px] uppercase transition-all shadow-lg">
                Sign Out System
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white/80 backdrop-blur-md border-b p-6 flex justify-between items-center sticky top-0 z-40">
            <h2 id="tabTitle" class="text-sm font-black text-slate-400 uppercase tracking-[0.3em]">Approvals</h2>
            <div class="flex items-center gap-4">
                <span class="h-2 w-2 bg-emerald-500 rounded-full animate-pulse"></span>
                <span class="text-[10px] font-black uppercase text-slate-500">System Online</span>
            </div>
        </header>

        <div class="p-10 max-w-6xl mx-auto space-y-12">
            
            <section id="approvals" class="tab-content active animate-in fade-in duration-500">
                <div class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/50 border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black uppercase text-slate-400">
                            <tr><th class="p-6">Student Account</th><th class="p-6 text-right">Access Control</th></tr>
                        </thead>
                        <tbody id="pendingTable" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>

            <section id="academic" class="tab-content space-y-10">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                        <h3 class="font-black text-blue-900 mb-6 uppercase text-xs tracking-widest">New Course Entry</h3>
                        <form id="courseForm" class="space-y-4">
                            <input type="text" id="courseName" placeholder="Course Code (e.g., BSIT)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-blue-600 font-bold" required>
                            <input type="number" id="totalYears" placeholder="Duration (Years)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-blue-600 font-bold" required>
                            <button class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-xl hover:bg-blue-700 transition-all">Add Course</button>
                        </form>
                    </div>
                    <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200">
                        <h3 class="font-black text-blue-900 mb-6 uppercase text-xs tracking-widest">Subject Registration</h3>
                        <form id="subjectForm" class="space-y-4">
                            <input type="text" id="subjName" placeholder="Full Subject Name" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-blue-600 font-bold" required>
                            <select id="subjCourse" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-blue-600"></select>
                            <div class="grid grid-cols-2 gap-4">
                                <input type="number" id="subjYear" placeholder="Year Level" class="p-4 bg-slate-50 rounded-2xl border-none font-bold outline-blue-600">
                                <input type="number" id="subjSem" placeholder="Semester" class="p-4 bg-slate-50 rounded-2xl border-none font-bold outline-blue-600">
                            </div>
                            <button class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-xl hover:bg-indigo-700 transition-all">Register Subject</button>
                        </form>
                    </div>
                </div>

                <div class="space-y-6">
                    <h4 class="text-xs font-black uppercase text-slate-400 tracking-widest ml-4 italic">Master Records Management</h4>
                    <div class="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                        <div class="p-4 bg-slate-50 border-b flex justify-between items-center">
                            <span class="text-[10px] font-black text-blue-900 uppercase">Manage Academic Entities</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400 border-b">
                                    <tr><th class="p-4">Entity Name</th><th class="p-4">Type</th><th class="p-4 text-right">Actions</th></tr>
                                </thead>
                                <tbody id="crudTable" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>

            <section id="assignments" class="tab-content space-y-8">
                <div class="bg-indigo-900 text-white p-10 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                    <div class="relative z-10">
                        <h3 class="font-black text-xl mb-6 uppercase tracking-tighter italic">Create Secure Class Assignment</h3>
                        <form id="classForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <select id="classSubject" class="p-4 bg-white/10 rounded-2xl border-none text-white font-bold outline-blue-400" required></select>
                            <select id="classTeacher" class="p-4 bg-white/10 rounded-2xl border-none text-white font-bold outline-blue-400" required></select>
                            <input type="text" id="classYear" placeholder="School Year (e.g. 2026-2027)" class="p-4 bg-white/10 rounded-2xl border-none text-white font-bold outline-blue-400" required>
                            <select id="classSem" class="p-4 bg-white/10 rounded-2xl border-none text-white font-bold outline-blue-400">
                                <option value="1">1st Semester</option><option value="2">2nd Semester</option>
                            </select>
                            <button class="md:col-span-2 bg-emerald-500 text-white py-5 rounded-2xl font-black uppercase text-xs shadow-xl hover:bg-emerald-400 transition-all">Link Teacher to Subject</button>
                        </form>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] shadow-sm border overflow-hidden">
                    <div class="p-4 bg-slate-50 border-b"><h4 class="text-[10px] font-black text-slate-400 uppercase">Live Assignments</h4></div>
                    <div id="masterAssignmentsTable" class="divide-y"></div>
                </div>
            </section>

            <section id="comms" class="tab-content space-y-6">
                <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-200">
                    <h3 class="font-black text-slate-800 text-lg mb-6 flex items-center gap-3">
                        <i class="fas fa-paper-plane text-blue-600"></i> Dispatch Announcement
                    </h3>
                    <form id="noteForm" class="space-y-4">
                        <select id="noteTeacher" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-blue-600" required></select>
                        <textarea id="noteText" placeholder="Write message to teacher(s)..." class="w-full p-6 bg-slate-50 rounded-2xl border-none outline-blue-600 h-40 font-medium"></textarea>
                        <button class="w-full bg-blue-900 text-white py-5 rounded-2xl font-black text-xs uppercase shadow-xl hover:bg-blue-800 transition-all">Send to Teacher Dashboard</button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, setDoc, addDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

       const firebaseConfig = {
  apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E",
  authDomain: "cmcsvls.firebaseapp.com",
  projectId: "cmcsvls",
  storageBucket: "cmcsvls.firebasestorage.app",
  messagingSenderId: "973791112453",
  appId: "1:973791112453:web:728b9ac51c0f3f89955b6c",
  measurementId: "G-7KEY33ZZHE"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- UI NAVIGATION ---
        window.showTab = (tab) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('tabTitle').innerText = tab;
            refreshAll();
        };

        onAuthStateChanged(auth, u => { if(!u) window.location.href="login.html"; else document.getElementById('adminEmail').innerText = u.email; });

        // --- CORE REFRESH DISPATCHER ---
        async function refreshAll() {
            loadPending();
            loadDropdowns();
            loadCRUD();
            loadAssignments();
        }

        // 1. APPROVALS
        async function loadPending() {
            const table = document.getElementById('pendingTable');
            table.innerHTML = "";
            const q = query(collection(db, "users"), where("active", "==", false), where("role", "==", "student"));
            const snap = await getDocs(q);
            snap.forEach(d => {
                table.innerHTML += `<tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-6 font-bold text-slate-700">${d.data().email}</td>
                    <td class="p-6 text-right"><button onclick="approve('${d.id}')" class="bg-blue-600 text-white px-5 py-2 rounded-full font-black text-[10px] uppercase shadow-lg shadow-blue-200">Grant Access</button></td>
                </tr>`;
            });
        }
        window.approve = async (id) => { await updateDoc(doc(db, "users", id), { active: true }); refreshAll(); };

        // 2. DROPDOWNS
        async function loadDropdowns() {
            const courses = await getDocs(collection(db, "courses"));
            const subjects = await getDocs(collection(db, "subjects"));
            const teachers = await getDocs(collection(db, "teachers"));
            
            const fill = (id, snap, def) => {
                const el = document.getElementById(id);
                el.innerHTML = `<option value="">${def}</option>`;
                snap.forEach(d => el.innerHTML += `<option value="${d.id}">${d.data().name || d.data().email}</option>`);
            };

            fill('subjCourse', courses, "Select Parent Course");
            fill('classSubject', subjects, "Select Subject");
            fill('classTeacher', teachers, "Select Faculty");
            fill('noteTeacher', teachers, "Global (All) or Specific Teacher");
        }

        // 3. CRUD MANAGEMENT (SAVE, UPDATE, DELETE)
        async function loadCRUD() {
            const table = document.getElementById('crudTable');
            table.innerHTML = "";
            
            const collections = ['teachers', 'subjects', 'courses'];
            for (const col of collections) {
                const snap = await getDocs(collection(db, col));
                snap.forEach(d => {
                    table.innerHTML += `<tr class="hover:bg-slate-50">
                        <td class="p-4 font-bold text-slate-800">${d.data().name}</td>
                        <td class="p-4 text-[10px] font-black uppercase text-slate-400 tracking-tighter">${col}</td>
                        <td class="p-4 text-right space-x-4">
                            <button onclick="editEntry('${col}', '${d.id}', '${d.data().name}')" class="text-blue-600 font-bold text-xs"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteEntry('${col}', '${d.id}')" class="text-rose-500 font-bold text-xs"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
            }
        }

        window.deleteEntry = async (col, id) => {
            if(confirm("Confirm deletion? This will affect all linked schedules.")) {
                await deleteDoc(doc(db, col, id)); refreshAll();
            }
        };

        window.editEntry = async (col, id, old) => {
            const val = prompt("Enter new name:", old);
            if(val && val !== old) { await updateDoc(doc(db, col, id), { name: val }); refreshAll(); }
        };

        // 4. CLASS ASSIGNMENTS (WITH DUP PREVENTION)
        document.getElementById('classForm').onsubmit = async (e) => {
            e.preventDefault();
            const sid = document.getElementById('classSubject').value;
            const tid = document.getElementById('classTeacher').value;
            const sy = document.getElementById('classYear').value;
            const sem = document.getElementById('classSem').value;

            const classID = `${sid}_${tid}_${sy}_${sem}`.replace(/\s+/g, '');
            const check = await getDoc(doc(db, "classes", classID));
            
            if(check.exists()) return alert("Error: Duplicate assignment exists for this SY/Sem.");

            await setDoc(doc(db, "classes", classID), { 
                subjectId: sid, teacherId: tid, schoolYear: sy, semester: sem 
            });
            alert("Assignment Securely Created.");
            refreshAll();
        };

        async function loadAssignments() {
            const container = document.getElementById('masterAssignmentsTable');
            container.innerHTML = "";
            const snap = await getDocs(collection(db, "classes"));
            for (const d of snap.docs) {
                const sub = await getDoc(doc(db, "subjects", d.data().subjectId));
                const tea = await getDoc(doc(db, "teachers", d.data().teacherId));
                container.innerHTML += `<div class="p-6 flex justify-between items-center group hover:bg-slate-50 transition-all">
                    <div>
                        <h5 class="font-black text-slate-800 text-sm uppercase">${sub.exists() ? sub.data().name : 'Missing Sub'}</h5>
                        <p class="text-xs font-bold text-slate-400">Assigned: <span class="text-indigo-600">${tea.exists() ? tea.data().name : 'Missing Teacher'}</span></p>
                    </div>
                    <button onclick="deleteEntry('classes', '${d.id}')" class="opacity-0 group-hover:opacity-100 bg-rose-50 text-rose-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all">Revoke Access</button>
                </div>`;
            }
        }

        // 5. NOTES DISPATCH
        document.getElementById('noteForm').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "announcements"), {
                teacherId: document.getElementById('noteTeacher').value,
                message: document.getElementById('noteText').value,
                date: new Date().toISOString()
            });
            alert("Announcement dispatched to faculty portal.");
            document.getElementById('noteForm').reset();
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth).then(()=>window.location.href="login.html");
        
        refreshAll();
    </script>
</body>
</html>
