<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAdmin Dashboard | SVLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-blue-800 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold tracking-tight">SVLS ADMIN CORE</h1>
        <div class="flex items-center gap-4">
            <span id="adminEmail" class="text-sm opacity-80"></span>
            <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold transition">Logout</button>
        </div>
    </nav>

    <div class="p-6 max-w-7xl mx-auto space-y-8">

        <section class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="bg-gray-50 p-4 border-b">
                <h2 class="text-lg font-bold text-gray-800">Pending Student Approvals</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-xs uppercase bg-gray-100 text-gray-600">
                            <th class="p-4">Student Email</th>
                            <th class="p-4">Status</th>
                            <th class="p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTable" class="divide-y divide-gray-100">
                        </tbody>
                </table>
            </div>
        </section>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-blue-800 mb-4 border-b pb-2">1. Create Course</h3>
                    <form id="courseForm" class="space-y-3">
                        <input type="text" id="courseName" placeholder="Course Name (e.g., BSTI)" class="w-full p-2 border rounded" required>
                        <input type="number" id="totalYears" placeholder="Duration (Years)" class="w-full p-2 border rounded" required>
                        <button class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Add Course</button>
                    </form>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-blue-800 mb-4 border-b pb-2">2. Create Subject</h3>
                    <form id="subjectForm" class="space-y-3">
                        <input type="text" id="subjName" placeholder="Subject Name" class="w-full p-2 border rounded" required>
                        <select id="subjCourse" class="w-full p-2 border rounded" required></select>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="subjYear" placeholder="Year" class="w-full p-2 border rounded" required>
                            <input type="number" id="subjSem" placeholder="Sem" class="w-full p-2 border rounded" required>
                        </div>
                        <button class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">Add Subject</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-blue-800 mb-4 border-b pb-2">3. Create Class (Assign Teacher to Subject)</h3>
                <p class="text-xs text-gray-500 mb-4">A "Class" connects a subject, a teacher, and a school year.</p>
                <form id="classForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600">Select Subject</label>
                        <select id="classSubject" class="w-full p-2 border rounded" required></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600">Select Teacher</label>
                        <select id="classTeacher" class="w-full p-2 border rounded" required></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600">School Year</label>
                        <input type="text" id="classYear" placeholder="2025-2026" class="w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600">Semester</label>
                        <select id="classSem" class="w-full p-2 border rounded">
                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <button class="w-full bg-green-600 text-white py-3 rounded font-bold hover:bg-green-700 transition">Open Class</button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E",
  authDomain: "cmcsvls.firebaseapp.com",
  projectId: "cmcsvls",
  storageBucket: "cmcsvls.firebasestorage.app",
  messagingSenderId: "973791112453",
  appId: "1:973791112453:web:728b9ac51c0f3f89955b6c",
  measurementId: "G-7KEY33ZZHE"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Security Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) window.location.href = "login.html";
            else document.getElementById('adminEmail').innerText = user.email;
        });

        // 1. STUDENT APPROVAL LOGIC
        async function loadPendingStudents() {
            const table = document.getElementById('pendingTable');
            table.innerHTML = "";
            const q = query(collection(db, "users"), where("active", "==", false), where("role", "==", "student"));
            const snapshot = await getDocs(q);
            snapshot.forEach(d => {
                const data = d.data();
                table.innerHTML += `
                    <tr>
                        <td class="p-4">${data.email}</td>
                        <td class="p-4"><span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs">Pending</span></td>
                        <td class="p-4"><button onclick="approveStudent('${d.id}')" class="text-blue-600 font-bold hover:underline">Approve</button></td>
                    </tr>`;
            });
        }
        window.approveStudent = async (id) => {
            await updateDoc(doc(db, "users", id), { active: true });
            alert("Student Approved!"); loadPendingStudents();
        };

        // 2. DATA LOADING (Dropdowns)
        async function loadDropdowns() {
            const coursesSnap = await getDocs(collection(db, "courses"));
            const subCourse = document.getElementById('subjCourse');
            subCourse.innerHTML = "";
            coursesSnap.forEach(d => subCourse.innerHTML += `<option value="${d.id}">${d.data().name}</option>`);

            const subjectsSnap = await getDocs(collection(db, "subjects"));
            const classSub = document.getElementById('classSubject');
            classSub.innerHTML = "";
            subjectsSnap.forEach(d => classSub.innerHTML += `<option value="${d.id}">${d.data().name}</option>`);

            const teachersSnap = await getDocs(collection(db, "teachers"));
            const classTeach = document.getElementById('classTeacher');
            classTeach.innerHTML = "";
            teachersSnap.forEach(d => classTeach.innerHTML += `<option value="${d.id}">${d.data().name}</option>`);
        }

        // 3. FORM HANDLERS
        document.getElementById('courseForm').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "courses"), {
                name: document.getElementById('courseName').value,
                totalYears: document.getElementById('totalYears').value
            });
            alert("Course Added"); loadDropdowns();
        };

        document.getElementById('subjectForm').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "subjects"), {
                name: document.getElementById('subjName').value,
                courseId: document.getElementById('subjCourse').value,
                yearLevel: document.getElementById('subjYear').value,
                semester: document.getElementById('subjSem').value
            });
            alert("Subject Added"); loadDropdowns();
        };

        document.getElementById('classForm').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "classes"), {
                subjectId: document.getElementById('classSubject').value,
                teacherId: document.getElementById('classTeacher').value,
                schoolYear: document.getElementById('classYear').value,
                semester: document.getElementById('classSem').value
            });
            alert("Class Opened & Teacher Assigned!");
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth);

        // Run on load
        loadPendingStudents();
        loadDropdowns();
    </script>
</body>
</html>
