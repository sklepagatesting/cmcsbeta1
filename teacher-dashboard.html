<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Command | SVLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .active-student { background-color: #f0f7ff !important; border-left: 4px solid #3b82f6 !important; }
        .sidebar-link.active { background: #1e1b4b; border-right: 4px solid #6366f1; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .panel { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-800">

    <aside class="w-72 bg-indigo-950 text-indigo-300 flex-shrink-0 flex flex-col sticky top-0 h-screen shadow-2xl z-50 no-print">
        <div class="p-8 border-b border-indigo-900">
            <h1 class="text-2xl font-black tracking-tighter text-white italic">SVLS <span class="text-indigo-400">FACULTY</span></h1>
            <p id="teacherEmail" class="text-[10px] font-bold uppercase tracking-widest text-indigo-500 mt-2 truncate"></p>
        </div>

        <nav class="flex-1 mt-6 overflow-y-auto">
            <div class="px-6 mb-4 text-[10px] font-black uppercase tracking-[0.2em] text-indigo-500">My Classes</div>
            <div id="classList" class="space-y-1 px-3">
                </div>

            <div class="px-6 mt-8 mb-4 text-[10px] font-black uppercase tracking-[0.2em] text-indigo-500">Communications</div>
            <button onclick="showTab('inbox')" class="w-full flex items-center gap-4 px-8 py-4 transition-all hover:text-white relative">
                <i class="fas fa-envelope"></i> <span class="text-xs font-black uppercase">Admin Notes</span>
                <span id="noteBadge" class="hidden absolute right-6 h-2 w-2 bg-rose-500 rounded-full"></span>
            </button>
        </nav>

        <div class="p-6 border-t border-indigo-900">
            <button id="logoutBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl font-black text-[10px] uppercase transition-all shadow-lg">
                Logout Session
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto">
        
        <header class="bg-white/80 backdrop-blur-md border-b p-6 flex justify-between items-center sticky top-0 z-40 no-print">
            <div>
                <h2 id="activeClassName" class="text-sm font-black text-slate-400 uppercase tracking-[0.3em]">Select a Class</h2>
                <p id="activeClassDetails" class="text-[10px] font-bold text-indigo-600"></p>
            </div>
            
            <div id="tabNav" class="hidden flex bg-slate-100 p-1 rounded-xl">
                <button onclick="switchTab('attendance')" id="tab-attendance" class="px-4 py-2 rounded-lg font-black text-[10px] uppercase transition-all">Attendance</button>
                <button onclick="switchTab('grades')" id="tab-grades" class="px-4 py-2 rounded-lg font-black text-[10px] uppercase transition-all">Grades</button>
                <button onclick="switchTab('resources')" id="tab-resources" class="px-4 py-2 rounded-lg font-black text-[10px] uppercase transition-all">Resources</button>
            </div>
        </header>

        <div class="p-8 max-w-6xl mx-auto">
            
            <div id="welcomeScreen" class="bg-white p-20 rounded-[3rem] shadow-sm border border-dashed border-slate-300 text-center no-print mt-10">
                <i class="fas fa-chalkboard-teacher text-6xl text-slate-100 mb-6"></i>
                <h2 class="text-xl font-black text-slate-400 uppercase tracking-widest">Faculty Command Center</h2>
                <p class="text-slate-400 text-sm mt-2">Select a class from the sidebar to begin session</p>
            </div>

            <div id="mainDashboard" class="hidden space-y-6">
                
                <section id="panel-attendance" class="tab-content">
                    <div class="bg-white rounded-[2rem] shadow-xl border p-8">
                        <div class="flex flex-wrap items-center justify-between gap-4 mb-8 no-print">
                            <div class="flex items-center gap-3">
                                <label class="text-[10px] font-black uppercase text-slate-400">Class Date:</label>
                                <input type="date" id="attendanceDate" class="bg-slate-50 p-2 rounded-xl outline-none font-bold text-sm">
                            </div>
                            <div class="flex gap-2">
                                <button onclick="loadAttendanceByDate()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg shadow-indigo-100">Sync Data</button>
                                <button onclick="window.print()" class="bg-slate-100 text-slate-600 px-6 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-slate-200 transition-all"><i class="fas fa-print mr-2"></i>Print Report</button>
                            </div>
                        </div>

                        <div class="print-only hidden mb-8 border-b pb-4">
                            <h1 class="text-2xl font-black italic" id="printHeaderTitle"></h1>
                            <p id="printHeaderSub" class="text-xs font-bold text-slate-500 uppercase tracking-widest"></p>
                        </div>

                        <div id="attendanceContainer" class="overflow-x-auto"></div>
                    </div>
                </section>

                <section id="panel-grades" class="tab-content">
                    <div class="bg-white rounded-[2rem] shadow-xl border p-8">
                        <div id="gradesContainer" class="overflow-x-auto"></div>
                    </div>
                </section>

                <section id="panel-resources" class="tab-content">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="bg-white p-8 rounded-[2rem] shadow-xl border">
                            <h4 class="font-black text-xs uppercase tracking-widest mb-6 text-indigo-600">Publish Material</h4>
                            <form id="resourceForm" class="space-y-4">
                                <input type="text" id="resTitle" placeholder="Topic/Activity Title" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-indigo-500 font-bold" required>
                                <input type="url" id="resLink" placeholder="External Link (URL)" class="w-full p-4 bg-slate-50 rounded-2xl border-none outline-indigo-500 font-bold" required>
                                <select id="resType" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold">
                                    <option value="Quiz">Quiz</option><option value="Assignment">Assignment</option><option value="Material">Learning Material</option>
                                </select>
                                <button class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black uppercase text-xs shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all">Upload to Portal</button>
                            </form>
                        </div>
                        <div id="resourceList" class="space-y-3"></div>
                    </div>
                </section>
            </div>

            <section id="inbox" class="tab-content active">
                <div class="max-w-3xl">
                    <h3 class="font-black text-slate-800 text-lg mb-6 flex items-center gap-3"><i class="fas fa-bell text-rose-500"></i> Official Admin Directives</h3>
                    <div id="adminNotesList" class="space-y-4">
                        </div>
                </div>
            </section>

        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E", 
            authDomain: "cmcsvls.firebaseapp.com", 
            projectId: "cmcsvls", 
            storageBucket: "cmcsvls.firebasestorage.app", 
            messagingSenderId: "973791112453", 
            appId: "1:973791112453:web:728b9ac51c0f3f89955b6c"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let tid, classId, studentsList = [], selectedStudentId = null;

        onAuthStateChanged(auth, u => { 
            if(u){ 
                tid = u.uid; 
                document.getElementById('teacherEmail').innerText = u.email;
                loadClasses(); 
                loadAdminNotes();
            } 
            else window.location.href="login.html"; 
        });

        // --- SIDEBAR TABS ---
        window.showTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'inbox') {
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('mainDashboard').classList.add('hidden');
            }
        };

        // --- LOAD ADMIN MESSAGES ---
        async function loadAdminNotes() {
            const list = document.getElementById('adminNotesList');
            const q = query(collection(db, "announcements"), where("teacherId", "in", [tid, ""]), orderBy("date", "desc"));
            const snap = await getDocs(q);
            list.innerHTML = "";
            if(snap.empty) list.innerHTML = `<div class="p-8 text-center text-slate-300 font-bold italic border-2 border-dashed rounded-3xl">No directives from administration at this time.</div>`;
            
            snap.forEach(d => {
                const data = d.data();
                list.innerHTML += `
                <div class="bg-white p-6 rounded-[2rem] border-l-8 border-rose-500 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-rose-500 uppercase tracking-widest">Directive #${d.id.slice(0,5)}</span>
                        <span class="text-[9px] font-bold text-slate-400">${new Date(data.date).toLocaleDateString()}</span>
                    </div>
                    <p class="text-sm font-medium text-slate-700 leading-relaxed">${data.message}</p>
                </div>`;
            });
        }

        // --- CLASS LOGIC ---
        async function loadClasses() {
            const list = document.getElementById('classList');
            const snap = await getDocs(query(collection(db, "classes"), where("teacherId", "==", tid)));
            list.innerHTML = "";
            snap.forEach(async d => {
                const sub = await getDoc(doc(db, "subjects", d.data().subjectId));
                const div = document.createElement('div');
                div.className = "sidebar-class p-4 rounded-2xl cursor-pointer hover:bg-indigo-900/50 transition-all text-xs font-bold text-indigo-300 hover:text-white mb-1";
                div.innerHTML = `<div class="flex items-center gap-3"><i class="fas fa-book-open opacity-40"></i> <span>${sub.data().name}</span></div>`;
                div.onclick = () => {
                    document.querySelectorAll('.sidebar-class').forEach(el => el.classList.remove('active', 'bg-indigo-900', 'text-white'));
                    div.classList.add('active', 'bg-indigo-900', 'text-white');
                    selectClass(d.id, sub.data().name, d.data());
                };
                list.appendChild(div);
            });
        }

        async function selectClass(id, name, details) {
            classId = id;
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('inbox').classList.remove('active');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('tabNav').classList.remove('hidden');
            document.getElementById('activeClassName').innerText = name;
            document.getElementById('activeClassDetails').innerText = `${details.schoolYear} • Semester ${details.semester}`;
            
            document.getElementById('printHeaderTitle').innerText = name;
            document.getElementById('printHeaderSub').innerText = `${details.schoolYear} - Semester ${details.semester}`;

            const sSnap = await getDocs(query(collection(db, "students"), where("status", "==", "enrolled")));
            studentsList = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
            switchTab('attendance');
            loadResources();
        }

        window.switchTab = (t) => {
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('#tabNav button').forEach(b => b.className = "px-4 py-2 rounded-lg font-black text-[10px] uppercase transition-all text-slate-400");
            
            document.getElementById(`panel-${t}`).classList.add('active');
            document.getElementById(`tab-${t}`).classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
            
            if(t === 'attendance') loadAttendanceByDate();
            if(t === 'grades') loadGrades();
        };

        // --- ATTENDANCE, GRADES, RESOURCES Logic remain same as previous version but styled ---
        // (Re-pasting the core sync functions for complete functionality)

        window.loadAttendanceByDate = async () => {
            const date = document.getElementById('attendanceDate').value;
            const body = document.getElementById('attendanceContainer');
            body.innerHTML = `<table class="w-full text-left"><thead class="text-[10px] font-black text-slate-400 uppercase"><tr><th class="pb-4">Student Name</th><th class="pb-4 text-right">Status</th></tr></thead><tbody id="attBody" class="divide-y"></tbody></table>`;
            const tbody = document.getElementById('attBody');
            for(let s of studentsList) {
                const snap = await getDoc(doc(db, "attendance", `${classId}_${s.id}_${date}`));
                const status = snap.exists() ? snap.data().status : "";
                const row = document.createElement('tr');
                row.className = `cursor-pointer ${selectedStudentId === s.id ? 'active-student' : ''}`;
                row.dataset.sid = s.id;
                row.onclick = () => { selectedStudentId = s.id; document.querySelectorAll('tr').forEach(r => r.classList.remove('active-student')); row.classList.add('active-student'); };
                row.innerHTML = `<td class="py-4 font-bold text-sm">${s.firstName} ${s.lastName}</td><td class="text-right">
                    <select onchange="saveAtt('${s.id}', this.value)" class="bg-slate-50 p-2 rounded-xl text-xs font-bold no-print outline-none">
                        <option value="">MARK</option><option value="Present" ${status=='Present'?'selected':''}>PRESENT</option><option value="Absent" ${status=='Absent'?'selected':''}>ABSENT</option>
                    </select>
                    <span class="print-only hidden font-bold text-xs">${status || 'UNMARKED'}</span>
                </td>`;
                tbody.appendChild(row);
            }
        };

        window.saveAtt = async (sid, status) => {
            const date = document.getElementById('attendanceDate').value;
            await setDoc(doc(db, "attendance", `${classId}_${sid}_${date}`), { classId, studentId: sid, date, status }, { merge: true });
        };

        async function loadGrades() {
            const body = document.getElementById('gradesContainer');
            body.innerHTML = `<table class="w-full text-left"><thead class="text-[10px] font-black text-slate-400 uppercase"><tr><th class="pb-4">Student</th><th class="pb-4">Grade</th><th class="pb-4">Equiv</th><th class="pb-4 text-right">Enrollment</th></tr></thead><tbody id="gradeBody" class="divide-y"></tbody></table>`;
            const tbody = document.getElementById('gradeBody');
            for(let s of studentsList) {
                const gSnap = await getDoc(doc(db, "grades", `${classId}_${s.id}`));
                const gData = gSnap.exists() ? gSnap.data() : { numericGrade: "", enrollmentStatus: "active" };
                const row = document.createElement('tr');
                row.className = selectedStudentId === s.id ? 'active-student' : '';
                row.innerHTML = `<td class="py-5 font-bold text-sm">${s.firstName} ${s.lastName}</td>
                    <td><input type="number" value="${gData.numericGrade}" onchange="saveGrade('${s.id}', this.value)" class="bg-slate-50 w-16 p-2 rounded-lg font-bold text-center"></td>
                    <td id="rt-${s.id}" class="font-black text-indigo-600">${gData.collegeGrade || '-'}</td>
                    <td class="text-right"><select onchange="updateEnrollStatus('${s.id}', this.value)" class="text-[10px] font-black p-2 rounded-lg border-none bg-slate-100"><option value="active" ${gData.enrollmentStatus=='active'?'selected':''}>ACTIVE</option><option value="dropped" ${gData.enrollmentStatus=='dropped'?'selected':''}>DROPPED</option></select></td>`;
                tbody.appendChild(row);
            }
        }

        window.saveGrade = async (sid, val) => {
            let cg = val >= 75 ? (1.0 + (100 - val) * 0.08).toFixed(2) : 5.0;
            if (val >= 95) cg = "1.00";
            document.getElementById(`rt-${sid}`).innerText = cg;
            await setDoc(doc(db, "grades", `${classId}_${sid}`), { classId, studentId: sid, numericGrade: val, collegeGrade: cg }, { merge: true });
        };

        async function loadResources() {
            const list = document.getElementById('resourceList');
            const snap = await getDocs(query(collection(db, "resources"), where("classId", "==", classId)));
            list.innerHTML = `<h4 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Class Timeline</h4>`;
            snap.forEach(d => {
                list.innerHTML += `<div class="p-4 bg-white border border-slate-100 rounded-3xl flex justify-between items-center shadow-sm"><div><h5 class="text-xs font-black text-slate-800 uppercase">${d.data().title}</h5><p class="text-[9px] text-indigo-500 font-black uppercase">${d.data().type}</p></div><a href="${d.data().url}" target="_blank" class="bg-indigo-50 p-2 rounded-xl text-indigo-600"><i class="fas fa-external-link-alt"></i></a></div>`;
            });
        }

        document.getElementById('resourceForm').onsubmit = async (e) => {
            e.preventDefault();
            const resId = `${classId}_${Date.now()}`;
            await setDoc(doc(db, "resources", resId), { classId, title: document.getElementById('resTitle').value, url: document.getElementById('resLink').value, type: document.getElementById('resType').value, publishDate: new Date().toISOString() });
            document.getElementById('resourceForm').reset();
            loadResources();
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth).then(()=>window.location.href="login.html");
    </script>
</body>
</html>
