<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Command Center | SVLS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .active-student { background-color: #eef2ff !important; border-left: 4px solid #4f46e5 !important; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; }
            .panel { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <nav class="bg-indigo-950 text-white p-4 shadow-2xl flex justify-between items-center sticky top-0 z-50 no-print">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-500 p-2 rounded-lg shadow-inner"><i class="fas fa-shield-halved"></i></div>
            <h1 class="text-xl font-black tracking-tighter">SVLS <span class="text-indigo-400">COMMAND</span></h1>
        </div>
        <button id="logoutBtn" class="bg-rose-600 hover:bg-rose-700 px-6 py-2 rounded-full text-xs font-black uppercase transition-all shadow-lg">Logout</button>
    </nav>

    <div class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <aside class="lg:col-span-3 space-y-4 no-print">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="text-slate-400 uppercase text-[10px] font-black tracking-[0.2em] mb-4">Class Command</h3>
                <div id="classList" class="space-y-3"></div>
            </div>

            <div id="scheduleWidget" class="hidden bg-indigo-900 text-white p-5 rounded-3xl shadow-lg">
                <h4 class="text-[10px] font-black uppercase opacity-60 mb-2">Class Duration</h4>
                <div class="space-y-2">
                    <input type="time" id="schedStart" onchange="updateSchedule()" class="bg-indigo-800 w-full p-2 rounded-lg text-xs outline-none border-none">
                    <p class="text-center text-[10px] opacity-40">TO</p>
                    <input type="time" id="schedEnd" onchange="updateSchedule()" class="bg-indigo-800 w-full p-2 rounded-lg text-xs outline-none border-none">
                </div>
            </div>
        </aside>

        <main class="lg:col-span-9 space-y-6">
            <div id="welcomeScreen" class="bg-white p-20 rounded-[2rem] shadow-sm border border-dashed border-slate-300 text-center no-print">
                <div class="text-6xl mb-4 text-slate-200"><i class="fas fa-layer-group"></i></div>
                <h2 class="text-2xl font-bold text-slate-400">Initialize a Class Session</h2>
            </div>

            <div id="mainDashboard" class="hidden space-y-6">
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 no-print">
                    <div>
                        <span id="classTag" class="bg-indigo-100 text-indigo-700 text-[10px] font-black px-3 py-1 rounded-full uppercase mb-2 inline-block">Session Active</span>
                        <h2 id="activeClassName" class="text-3xl font-black text-slate-900 leading-tight"></h2>
                        <p id="activeClassDetails" class="text-slate-500 font-medium"></p>
                    </div>
                    <div class="flex bg-slate-100 p-1.5 rounded-2xl w-full md:w-auto overflow-x-auto">
                        <button onclick="switchTab('attendance')" id="tab-attendance" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-xs transition-all whitespace-nowrap">Attendance</button>
                        <button onclick="switchTab('grades')" id="tab-grades" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-xs transition-all whitespace-nowrap">Grades & Status</button>
                        <button onclick="switchTab('resources')" id="tab-resources" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-xs transition-all whitespace-nowrap">Quizzes</button>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 p-8">
                    
                    <div id="panel-attendance" class="panel">
                        <div class="flex flex-wrap items-center justify-between gap-4 mb-8 no-print">
                            <div class="flex items-center gap-3">
                                <label class="text-xs font-black uppercase text-slate-400">Log Date:</label>
                                <input type="date" id="attendanceDate" class="border-2 border-slate-100 p-2 rounded-xl focus:border-indigo-500 outline-none font-bold text-sm">
                            </div>
                            <div class="flex gap-2">
                                <button onclick="loadAttendanceByDate()" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-600 transition-colors">Sync</button>
                                <button onclick="window.print()" class="bg-indigo-50 text-indigo-600 border border-indigo-200 px-4 py-2 rounded-xl text-xs font-bold hover:bg-indigo-100 transition-colors"><i class="fas fa-print mr-2"></i>Print Daily Report</button>
                            </div>
                        </div>
                        <div class="print-only hidden mb-6">
                            <h1 class="text-2xl font-bold" id="printHeaderTitle">Daily Attendance</h1>
                            <p id="printHeaderSub"></p>
                        </div>
                        <div id="attendanceContainer"></div>
                    </div>

                    <div id="panel-grades" class="panel hidden">
                        <div id="gradesContainer" class="overflow-x-auto"></div>
                    </div>

                    <div id="panel-resources" class="panel hidden">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                            <div>
                                <h4 class="font-black text-lg mb-6 flex items-center gap-2"><i class="fas fa-plus-circle text-indigo-500"></i> New Quiz/Link</h4>
                                <form id="resourceForm" class="space-y-4">
                                    <input type="text" id="resTitle" placeholder="Resource Title" class="w-full p-3 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-xl outline-none transition-all" required>
                                    <input type="url" id="resLink" placeholder="https://external-link.com" class="w-full p-3 bg-slate-50 border-2 border-transparent focus:border-indigo-500 rounded-xl outline-none transition-all" required>
                                    <div class="grid grid-cols-2 gap-4">
                                        <select id="resType" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none">
                                            <option value="Quiz">Quiz</option>
                                            <option value="Assignment">Assignment</option>
                                            <option value="Reading">Reading</option>
                                        </select>
                                        <input type="datetime-local" id="resDate" class="w-full p-3 bg-slate-50 rounded-xl border-none outline-none">
                                    </div>
                                    <button class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all">Publish to Class</button>
                                </form>
                            </div>
                            <div id="resourceList" class="space-y-3"></div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E",
  authDomain: "cmcsvls.firebaseapp.com",
  projectId: "cmcsvls",
  storageBucket: "cmcsvls.firebasestorage.app",
  messagingSenderId: "973791112453",
  appId: "1:973791112453:web:728b9ac51c0f3f89955b6c",
  measurementId: "G-7KEY33ZZHE"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let tid, classId, studentsList = [], selectedStudentId = null;

        onAuthStateChanged(auth, u => { 
            if(u){ tid=u.uid; loadClasses(); } 
            else window.location.href="login.html"; 
        });

        async function loadClasses() {
            const list = document.getElementById('classList');
            const snap = await getDocs(query(collection(db, "classes"), where("teacherId", "==", tid)));
            list.innerHTML = "";
            snap.forEach(async d => {
                const sub = await getDoc(doc(db, "subjects", d.data().subjectId));
                const div = document.createElement('div');
                div.className = "p-4 bg-white border border-slate-100 rounded-2xl cursor-pointer hover:shadow-md hover:border-indigo-200 transition-all group";
                div.innerHTML = `<h4 class="font-bold text-slate-800 group-hover:text-indigo-600">${sub.data().name}</h4><p class="text-[9px] font-black text-slate-300 uppercase">${d.data().schoolYear}</p>`;
                div.onclick = () => selectClass(d.id, sub.data().name, d.data());
                list.appendChild(div);
            });
        }

        async function selectClass(id, name, details) {
            classId = id;
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('scheduleWidget').classList.remove('hidden');
            document.getElementById('activeClassName').innerText = name;
            document.getElementById('activeClassDetails').innerText = `${details.schoolYear} • Sem ${details.semester}`;
            
            // Set Schedule values
            document.getElementById('schedStart').value = details.startTime || "08:00";
            document.getElementById('schedEnd').value = details.endTime || "09:00";

            // Set Print Headers
            document.getElementById('printHeaderTitle').innerText = `Attendance: ${name}`;
            
            const sSnap = await getDocs(query(collection(db, "students"), where("status", "==", "enrolled")));
            studentsList = sSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            // Default current date
            document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];
            
            switchTab('attendance');
            loadResources();
        }

        window.updateSchedule = async () => {
            const startTime = document.getElementById('schedStart').value;
            const endTime = document.getElementById('schedEnd').value;
            await updateDoc(doc(db, "classes", classId), { startTime, endTime });
        };

        window.switchTab = (t) => {
            document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('bg-indigo-600', 'text-white', 'shadow-indigo-200', 'shadow-lg'));
            document.getElementById(`panel-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).classList.add('bg-indigo-600', 'text-white', 'shadow-indigo-200', 'shadow-lg');
            if(t === 'attendance') loadAttendanceByDate();
            if(t === 'grades') loadGrades();
        };

        window.highlightStudent = (sid) => {
            selectedStudentId = sid;
            document.querySelectorAll('tr').forEach(r => r.classList.remove('active-student'));
            const rows = document.querySelectorAll(`[data-sid="${sid}"]`);
            rows.forEach(r => r.classList.add('active-student'));
        };

        // --- ATTENDANCE ---
        window.loadAttendanceByDate = async () => {
            const date = document.getElementById('attendanceDate').value;
            document.getElementById('printHeaderSub').innerText = `Date: ${date} | Class ID: ${classId}`;
            const body = document.getElementById('attendanceContainer');
            body.innerHTML = `<table class="w-full text-left">
                <thead class="text-[10px] font-black text-slate-400 uppercase"><tr><th class="pb-3 border-b">Student Name</th><th class="pb-3 border-b text-right">Status</th></tr></thead>
                <tbody id="attBody" class="divide-y"></tbody>
            </table>`;
            const tbody = document.getElementById('attBody');
            
            for(let s of studentsList) {
                const snap = await getDoc(doc(db, "attendance", `${classId}_${s.id}_${date}`));
                const status = snap.exists() ? snap.data().status : "";
                const row = document.createElement('tr');
                row.className = `cursor-pointer transition-colors ${selectedStudentId === s.id ? 'active-student' : ''}`;
                row.dataset.sid = s.id;
                row.onclick = () => highlightStudent(s.id);
                row.innerHTML = `<td class="py-4 font-bold text-sm">${s.firstName} ${s.lastName}</td><td class="text-right">
                    <select onchange="saveAtt('${s.id}', this.value)" class="bg-slate-50 p-2 rounded-xl text-xs font-bold no-print outline-none">
                        <option value="">MARK</option>
                        <option value="Present" ${status=='Present'?'selected':''}>PRESENT</option>
                        <option value="Absent" ${status=='Absent'?'selected':''}>ABSENT</option>
                    </select>
                    <span class="print-only hidden font-bold text-xs">${status || 'UNMARKED'}</span>
                </td>`;
                tbody.appendChild(row);
            }
        };

        window.saveAtt = async (sid, status) => {
            const date = document.getElementById('attendanceDate').value;
            await setDoc(doc(db, "attendance", `${classId}_${sid}_${date}`), { classId, studentId: sid, date, status }, { merge: true });
        };

        // --- GRADES ---
        async function loadGrades() {
            const body = document.getElementById('gradesContainer');
            body.innerHTML = `<table class="w-full text-left">
                <thead class="text-[10px] font-black text-slate-400 uppercase"><tr><th class="pb-4 border-b">Student</th><th class="pb-4 border-b">Numeric</th><th class="pb-4 border-b">Rating</th><th class="pb-4 border-b">Status</th></tr></thead>
                <tbody id="gradeBody" class="divide-y"></tbody>
            </table>`;
            const tbody = document.getElementById('gradeBody');

            for(let s of studentsList) {
                const gSnap = await getDoc(doc(db, "grades", `${classId}_${s.id}`));
                const gData = gSnap.exists() ? gSnap.data() : { numericGrade: "", enrollmentStatus: "active" };
                const row = document.createElement('tr');
                row.className = `cursor-pointer transition-colors ${selectedStudentId === s.id ? 'active-student' : ''}`;
                row.dataset.sid = s.id;
                row.onclick = () => highlightStudent(s.id);
                row.innerHTML = `
                    <td class="py-5 text-sm font-bold">${s.firstName} ${s.lastName}</td>
                    <td><input type="number" value="${gData.numericGrade}" onchange="saveGrade('${s.id}', this.value)" class="bg-slate-50 w-16 p-2 rounded-lg font-bold text-center"></td>
                    <td id="rt-${s.id}" class="font-black text-indigo-600">${gData.collegeGrade || '-'}</td>
                    <td>
                        <select onchange="updateEnrollStatus('${s.id}', this.value)" class="text-[10px] font-black p-2 rounded-lg border-2 ${gData.enrollmentStatus=='dropped'?'border-rose-200 text-rose-500':'border-slate-100'}">
                            <option value="active" ${gData.enrollmentStatus=='active'?'selected':''}>ACTIVE</option>
                            <option value="dropped" ${gData.enrollmentStatus=='dropped'?'selected':''}>DROPPED</option>
                        </select>
                    </td>`;
                tbody.appendChild(row);
            }
        }

        window.saveGrade = async (sid, val) => {
            let cg = val >= 75 ? (1.0 + (100 - val) * 0.08).toFixed(2) : 5.0;
            if (val >= 95) cg = "1.00";
            document.getElementById(`rt-${sid}`).innerText = cg;
            await setDoc(doc(db, "grades", `${classId}_${sid}`), { classId, studentId: sid, numericGrade: val, collegeGrade: cg }, { merge: true });
        };

        window.updateEnrollStatus = async (sid, s) => {
            await setDoc(doc(db, "grades", `${classId}_${sid}`), { enrollmentStatus: s }, { merge: true });
        };

        // --- RESOURCES ---
        document.getElementById('resourceForm').onsubmit = async (e) => {
            e.preventDefault();
            const resId = `${classId}_${Date.now()}`;
            await setDoc(doc(db, "resources", resId), {
                classId,
                title: document.getElementById('resTitle').value,
                url: document.getElementById('resLink').value,
                type: document.getElementById('resType').value,
                publishDate: document.getElementById('resDate').value || new Date().toISOString(),
            });
            document.getElementById('resourceForm').reset();
            loadResources();
        };

        async function loadResources() {
            const list = document.getElementById('resourceList');
            const snap = await getDocs(query(collection(db, "resources"), where("classId", "==", classId)));
            list.innerHTML = `<h4 class="text-[10px] font-black text-slate-400 uppercase mb-4">Class Timeline</h4>`;
            snap.forEach(d => {
                list.innerHTML += `<div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                    <div>
                        <h5 class="text-sm font-bold text-slate-800">${d.data().title}</h5>
                        <p class="text-[9px] text-slate-400 font-bold uppercase">${d.data().type} • ${new Date(d.data().publishDate).toLocaleString()}</p>
                    </div>
                    <a href="${d.data().url}" target="_blank" class="bg-white p-2 rounded-xl text-indigo-600"><i class="fas fa-link"></i></a>
                </div>`;
            });
        }

        document.getElementById('logoutBtn').onclick = () => signOut(auth).then(()=>window.location.href="login.html");
    </script>
</body>
</html>
