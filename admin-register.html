<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVLS - SuperAdmin Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Initial Admin Setup</h2>
        <p class="text-xs text-gray-500 mb-4 text-center">This page is only for the primary system administrator.</p>
        
        <form id="adminRegisterForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium">Full Name</label>
                <input type="text" id="adminName" required class="w-full p-2 border rounded mt-1 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium">Email Address</label>
                <input type="email" id="adminEmail" required class="w-full p-2 border rounded mt-1 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium">Password</label>
                <input type="password" id="adminPassword" required class="w-full p-2 border rounded mt-1 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Create Admin Account</button>
        </form>
        <div id="message" class="mt-4 text-sm text-center"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBK-v8xtt7x0AA_btC0oE88IolgU9m5Q3E",
  authDomain: "cmcsvls.firebaseapp.com",
  projectId: "cmcsvls",
  storageBucket: "cmcsvls.firebasestorage.app",
  messagingSenderId: "973791112453",
  appId: "1:973791112453:web:728b9ac51c0f3f89955b6c",
  measurementId: "G-7KEY33ZZHE"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('adminRegisterForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.innerText = "Processing...";

            const name = document.getElementById('adminName').value;
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            try {
                // 1. Check if an admin already exists (Security check)
                const q = query(collection(db, "users"), where("role", "==", "superadmin"));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    messageDiv.className = "mt-4 text-sm text-center text-red-600";
                    messageDiv.innerText = "A SuperAdmin already exists. Only one is allowed via this page.";
                    return;
                }

                // 2. Create User in Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 3. Create User Document in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: "superadmin",
                    active: true,
                    createdAt: new Date().toISOString()
                });

                messageDiv.className = "mt-4 text-sm text-center text-green-600";
                messageDiv.innerText = "Admin created successfully! Redirecting to login...";
                
                setTimeout(() => {
                    window.location.href = "login.html"; // We will create this next
                }, 2000);

            } catch (error) {
                messageDiv.className = "mt-4 text-sm text-center text-red-600";
                messageDiv.innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
